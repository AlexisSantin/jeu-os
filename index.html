<style>
body{margin:0;font-family:system-ui,sans-serif;background:#FFF8E7;text-align:center;user-select:none;-webkit-user-select:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px}

.hid{visibility:hidden}
#star{position:fixed;left:50%;top:40%;font-size:220px;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:9}
#star.go{animation:st 1.1s ease-out}@keyframes st{0%{transform:translate(-50%,-50%) scale(0) rotate(0)}40%{transform:translate(-50%,-50%) scale(1.3) rotate(200deg)}70%{transform:translate(-50%,-50%) scale(1) rotate(360deg)}100%{transform:translate(-50%,-50%) scale(0) rotate(400deg);opacity:0}}
.hint{animation:hn .6s ease-in-out infinite alternate}@keyframes hn{from{opacity:.2}to{opacity:1}}
#stars{font-size:34px;min-height:40px}
</style></head><body>
